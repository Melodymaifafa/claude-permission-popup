name: Claude iterates on Codex review

on:
  pull_request_review:
    types: [submitted]

# 调用方必须声明权限：可复用工作流只能收窄，不能放宽 caller 给的权限。
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  iterate:
    uses: Melodymaifafa/gh-workflows/.github/workflows/claude-codex-iterate.yml@v1
    with:
      runtime: node
      # iterate 跑在 ubuntu；package.json 限定 os=darwin，npm install 会报 EBADPLATFORM。
      # 测试只用 node 内置模块，不装依赖直接跑。
      verify_cmd: node --test
    secrets: inherit
