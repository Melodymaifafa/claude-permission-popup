name: Merge after clean Codex review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  merge:
    uses: Melodymaifafa/gh-workflows/.github/workflows/codex-approved-merge.yml@v1
    with:
      base_branch: develop
    secrets: inherit
